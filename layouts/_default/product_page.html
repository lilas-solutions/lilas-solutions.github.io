{{ define "main" }}
  <main class="content product-page page-{{ .Slug }}">
    <article class="post page">
      <header class="post-header">
        {{ with .Parent }}
        <a id="back-to-main-page" href="{{ .RelPermalink | relLangURL }}"><i class="fa fa-chevron-left" aria-hidden="true"></i> {{ or .Title .Site.Title }}</a>
        {{ end }}
      </header> 
      <h1 class="post-title"><img src='{{ .Param "icon" }}' class="product-icon"> {{ .Title }}</h1>
      <section class="post-content">

        <div class="card-gallery">
            {{ range $shot := .Params.Screenshots }}
            <div class='card-product-screenshot'><a href='{{ $shot }}'>
                <img class="product-screenshot" src='{{ $shot }}'/>
            </a></div>
            {{ end }}
        </div>
        
        {{ .Content }}
        <a class="btn site-menu" href='{{ .Param "web-url" }}'>{{ cond (eq $.Lang "es" ) "Empieza Ahora" "Start Now" }}</a>
      </section>
    </article>
  </main>
{{ end }}
